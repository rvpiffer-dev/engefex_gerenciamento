name: Backup Engefex para Google Drive
on:
  schedule:
    # 06:20 UTC = 03:20 em Brasília
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engefex-backup-drive
  cancel-in-progress: false
jobs:
  backup:
    if: ${{ vars.ENABLE_GDRIVE_BACKUP == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://kxekeeysonrppechegsq.supabase.co
      SUPABASE_DB_URL: ${{ secrets.ENGEFEX_BACKUP_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ENGEFEX_BACKUP_SERVICE_ROLE_KEY }}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.ENGEFEX_BACKUP_GDRIVE_TOKEN }}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: 18iUKY5XD34AhO9wsisUaScbtWMZiFq6p
      AGE_RECIPIENT: ${{ vars.ENGEFEX_BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Checkout da versão revisada
        uses: actions/checkout@v4
      - name: Validar pré-requisitos sem expor segredos
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::Falta ENGEFEX_BACKUP_DB_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Falta ENGEFEX_BACKUP_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$RCLONE_CONFIG_GDRIVE_TOKEN" || { echo "::error::Falta ENGEFEX_BACKUP_GDRIVE_TOKEN"; exit 1; }
          case "$AGE_RECIPIENT" in age1*) ;; *) echo "::error::Falta ENGEFEX_BACKUP_AGE_RECIPIENT"; exit 1;; esac
      - name: Preparar criptografia e Drive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone
      - name: Exportar PostgreSQL 17 e anexos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engefex-plain/storage"
          docker run --rm -e DATABASE_URL="$SUPABASE_DB_URL" \
            -v "$RUNNER_TEMP/engefex-plain:/backup" postgres:17-alpine \
            sh -c 'pg_dump -Fc --no-owner --no-acl --dbname "$DATABASE_URL" -f /backup/postgres.dump && pg_restore --list /backup/postgres.dump >/dev/null'
          python3 scripts/backup/backup_storage.py "$RUNNER_TEMP/engefex-plain/storage"
          tar -C "$RUNNER_TEMP/engefex-plain" -czf "$RUNNER_TEMP/engefex-plain.tar.gz" .
      - name: Criptografar cópia e apagar arquivos temporários
        shell: bash
        run: |
          set -euo pipefail
          NAME="Engefex_$(date -u +%Y%m%dT%H%M%SZ).tar.gz.age"
          printf '%s' "$NAME" > "$RUNNER_TEMP/engefex-backup-filename"
          age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/$NAME" "$RUNNER_TEMP/engefex-plain.tar.gz"
          test -s "$RUNNER_TEMP/$NAME"
          rm -rf "$RUNNER_TEMP/engefex-plain" "$RUNNER_TEMP/engefex-plain.tar.gz"
      - name: Enviar e verificar no Drive
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(cat "$RUNNER_TEMP/engefex-backup-filename")"
          rclone copyto "$RUNNER_TEMP/$NAME" "gdrive:$NAME" --retries 3
          rclone check "$RUNNER_TEMP" gdrive: --include "/$NAME" --one-way
          echo "Backup criptografado conferido no Drive."
