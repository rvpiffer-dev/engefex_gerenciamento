<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atualizar Engefex</title><style>body{font:18px system-ui;background:#f5f7fa;color:#203345;margin:0;padding:32px}main{max-width:520px;margin:40px auto;background:white;padding:28px;border-radius:16px}button,a{font:inherit}button{background:#ac612b;color:white;border:0;border-radius:8px;padding:14px;cursor:pointer}</style><main><h1>Atualizar aplicativo</h1><p>Carrega a versão atual preservando os cadastros e anexos neste navegador. Salve qualquer formulário aberto antes de continuar.</p><button id="update">Atualizar e abrir atividades</button><p id="status" role="status"></p><a href="./index.html#activities">Voltar ao gerenciador</a></main><script>
const button=document.getElementById('update'),status=document.getElementById('status');
button.onclick=async()=>{button.disabled=true;status.textContent='Buscando a versão atual…';try{if('serviceWorker' in navigator){const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});await registration.update();const worker=registration.installing||registration.waiting;if(worker&&worker.state!=='activated')await new Promise((resolve,reject)=>{const check=()=>{if(worker.state==='activated')resolve();else if(worker.state==='redundant')reject(Error('A atualização não foi concluída. Tente novamente com internet.'))};worker.addEventListener('statechange',check);check()});}location.replace('./index.html#activities')}catch(e){status.textContent='Não foi possível atualizar: '+e.message;button.disabled=false}};
</script></html>
