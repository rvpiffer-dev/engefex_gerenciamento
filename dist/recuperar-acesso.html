<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Atualizar acesso — Engefex</title><style>body{font:17px system-ui;background:#f3f5f8;color:#17243d;margin:0;padding:24px}main{max-width:520px;margin:40px auto;padding:26px;background:#fff;border-radius:14px}button{font:inherit;background:#1557ff;color:white;border:0;border-radius:8px;padding:14px 18px;cursor:pointer}p{line-height:1.6}#status{white-space:pre-wrap}</style></head><body><main><h1>Atualizar acesso</h1><p>Atualiza os arquivos do aplicativo que podem estar antigos neste celular. Não apaga login, cadastros, anexos nem dados do Supabase.</p><p>Salve qualquer formulário aberto antes de continuar.</p><button id="recover" type="button">Atualizar e entrar</button><p id="status" role="status"></p></main><script>
'use strict';const button=document.getElementById('recover'),status=document.getElementById('status');button.onclick=async()=>{button.disabled=true;status.textContent='Atualizando os arquivos do aplicativo…';try{const scope=new URL('./',location.href).href,testing=new URL(scope).pathname.split('/').includes('testes');if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();for(const registration of registrations)if(registration.scope===scope)await registration.unregister();}if('caches' in window){const names=await caches.keys();for(const name of names)if(testing?name.startsWith('engefex-gerenciamento-test-'):name.startsWith('engefex-gerenciamento-prod-')||/^engefex-gerenciamento-v\d+$/.test(name))await caches.delete(name);}status.textContent='Atualização concluída. Abrindo o sistema…';location.replace('./index.html?atualizado='+Date.now()+'#dashboard');}catch(error){status.textContent='Não foi possível concluir: '+error.message+'\nConfira a conexão e tente novamente.';button.disabled=false;}};
</script></body></html>
